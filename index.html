<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ערכות גוונים של סגול</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700&family=Assistant:wght@400;700&display=swap">
<style>
:root{--bg:#f7f4f8;--ink:#2a2230;--muted:#6b6072;--plum:#6d3f7d;--soft:#efe4f3;--line:#e3dbe7;--surface:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1b161e;--ink:#efe8f1;--muted:#b2a6b8;--plum:#c9a0d8;--soft:#3a2a42;--line:#3a3140;--surface:#251f29;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant",Arial,sans-serif;font-size:17px;line-height:1.6;padding:32px max(16px,env(safe-area-inset-left)) 48px}
.wrap{max-width:620px;margin:0 auto;display:grid;gap:16px}
h1{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:34px;margin:0}
p{margin:0;color:var(--muted)}
a.kit{display:block;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;color:var(--ink);text-decoration:none}
a.kit:hover,a.kit:focus-visible{border-color:var(--plum)}
a.kit small{color:var(--plum);font-weight:700;letter-spacing:.03em}
a.kit strong{display:block;font-family:"Frank Ruhl Libre",Georgia,serif;font-size:22px}
</style>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

</div>

</html>
